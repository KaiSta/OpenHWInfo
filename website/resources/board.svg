<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Board outline -->
  <rect x="96" y="112" width="320" height="272" rx="28" fill="#ffffff"/>

  <!-- Rear I/O panel -->
  <rect x="106" y="146" width="18" height="104" rx="8" fill="#1a2234"/>

  <!-- CPU socket, with a chip seated in it -->
  <rect x="144" y="160" width="112" height="112" rx="18" fill="#1a2234"/>
  <rect x="168" y="184" width="64" height="64" rx="10" fill="#ffffff"/>

  <!-- DIMM slots -->
  <rect x="352" y="150" width="18" height="112" rx="6" fill="#1a2234"/>
  <rect x="384" y="150" width="18" height="112" rx="6" fill="#1a2234"/>

  <!-- Chipset -->
  <rect x="144" y="312" width="64" height="64" rx="14" fill="#1a2234"/>

  <!-- Expansion slots -->
  <rect x="240" y="312" width="152" height="16" rx="6" fill="#1a2234"/>
  <rect x="240" y="344" width="116" height="16" rx="6" fill="#1a2234"/>

  <!-- Mounting holes -->
  <circle cx="128" cy="136" r="9" fill="#1a2234"/>
  <circle cx="384" cy="360" r="9" fill="#1a2234"/>
</svg>
