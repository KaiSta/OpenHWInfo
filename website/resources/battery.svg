<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Battery body -->
  <rect x="112" y="150" width="256" height="212" rx="32" fill="#ffffff"/>
  <!-- Terminal -->
  <rect x="368" y="216" width="36" height="80" rx="14" fill="#ffffff"/>

  <!-- Charge level: the pack is a little over two thirds full -->
  <rect x="142" y="180" width="130" height="152" rx="18" fill="#1a2234"/>
  <!-- Empty part of the cell -->
  <rect x="286" y="180" width="52" height="152" rx="12" fill="#1a2234" opacity="0.2"/>

  <!-- Charging bolt -->
  <path d="M232 200 L196 272 L226 272 L210 324 L266 246 L234 246 Z" fill="#ffffff"/>
</svg>
