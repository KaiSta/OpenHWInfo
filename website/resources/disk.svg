<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Drive body -->
  <rect x="112" y="140" width="288" height="232" rx="30" fill="#ffffff"/>

  <!-- Top face: the label area of a 2.5" drive -->
  <rect x="140" y="168" width="140" height="92" rx="12" fill="#1a2234"/>
  <!-- Printed lines on the label -->
  <rect x="156" y="192" width="108" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
  <rect x="156" y="216" width="72" height="12" rx="6" fill="#ffffff" opacity="0.35"/>

  <!-- SATA data and power connectors -->
  <rect x="304" y="176" width="72" height="30" rx="8" fill="#1a2234"/>
  <rect x="304" y="222" width="72" height="38" rx="8" fill="#1a2234"/>

  <!-- Activity indicator -->
  <circle cx="176" cy="316" r="14" fill="#1a2234"/>
  <!-- Ventilation slots along the bottom edge -->
  <rect x="222" y="306" width="150" height="20" rx="10" fill="#1a2234" opacity="0.35"/>
</svg>
