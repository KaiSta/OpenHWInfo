<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- GPU chip body -->
  <rect x="176" y="176" width="160" height="148" rx="30" fill="#ffffff"/>
  <!-- Recessed die (top-right of the chip) -->
  <rect x="252" y="200" width="64" height="64" rx="14" fill="#1a2234"/>

  <!-- Cooling fan (bottom-left of the chip): ring + hub + blades -->
  <circle cx="228" cy="272" r="30" fill="#ffffff"/>
  <circle cx="228" cy="272" r="19" fill="#1a2234"/>
  <g fill="#ffffff">
    <rect x="224" y="256" width="8" height="10" rx="2"/>
    <rect x="224" y="278" width="8" height="10" rx="2"/>
    <rect x="212" y="268" width="10" height="8" rx="2"/>
    <rect x="234" y="268" width="10" height="8" rx="2"/>
  </g>

  <!-- Memory modules (VRAM) along the bottom edge -->
  <g fill="#ffffff">
    <rect x="176" y="348" width="28" height="34" rx="6"/>
    <rect x="216" y="348" width="28" height="34" rx="6"/>
    <rect x="256" y="348" width="28" height="34" rx="6"/>
    <rect x="296" y="348" width="28" height="34" rx="6"/>
  </g>
</svg>