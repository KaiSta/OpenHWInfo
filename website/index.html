<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CPU and GPU Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: left;
            font-size: 16px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h2>CPU Information</h2>
    <img src="/resources/cpu.jpeg" alt="CPU Icon" width="64" height="64">
    <table>
        <tr>
            <th>Element</th>
            <th>Value</th>
        </tr>
        {{range .CpuKeys}}
            <tr>
                <td>{{.Label}}</td>
                <td>{{index $.CpuValues .Key}}</td>
            </tr>
        {{end}}
    </table>
    <h2>GPU Information</h2>
    <img src="/resources/gpu.jpg" alt="GPU Icon" width="64" height="64">
    <table>
        <tr>
            <th>Element</th>
            <th>Value</th>
        </tr>
        {{range .GpuKeys}}
            <tr>
                <td>{{.Label}}</td>
                <td>{{index $.GpuValues .Key}}</td>
            </tr>
        {{end}}
    </table>
    <script>
        setTimeout(function() {
            window.location.reload();
        }, 5000);
    </script>
</body>
</html>
