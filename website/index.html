<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHWInfo — Hardware Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrap">
        <header class="top">
            <div class="brand">
                <div class="logo">⚙️</div>
                <div>
                    <h1>OpenHWInfo</h1>
                    <div class="subtitle">Live CPU, memory, GPU, storage &amp; mainboard hardware monitor</div>
                </div>
            </div>
            <span class="refresh-note"><span class="dot"></span> Auto-refresh · 5s</span>
        </header>

        <main class="grid" id="cards"></main>

        <footer class="note">Data is collected locally on this host. Values refresh automatically every 5 seconds.</footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
