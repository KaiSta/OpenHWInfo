<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHWInfo — Hardware Monitor</title>
    <style>
        :root {
            --bg: #0b0f17;
            --surface: #121826;
            --surface-2: #1a2234;
            --border: #232d42;
            --text: #e6ebf5;
            --muted: #9aa6c0;
            --accent: #4f8cff;
            --accent-2: #7c5cff;
            --good: #2fd17a;
            --warn: #ffb020;
            --bad: #ff5d6c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(1200px 600px at 80% -10%, #14203a 0%, var(--bg) 55%) fixed, var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        header.top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: grid;
            place-items: center;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(79, 140, 255, 0.35);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.2px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-top: 3px;
        }

        .refresh-note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--good);
            box-shadow: 0 0 0 0 rgba(47, 209, 122, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(47, 209, 122, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(47, 209, 122, 0); }
            100% { box-shadow: 0 0 0 0 rgba(47, 209, 122, 0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: linear-gradient(180deg, var(--surface) 0%, #0f1522 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .card-head img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--surface-2);
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
        }

        .card-sub {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 18px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid rgba(35, 45, 66, 0.6);
        }

        th {
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.4px;
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover { background: rgba(79, 140, 255, 0.06); }

        .label-cell { color: var(--text); font-weight: 500; }
        .value-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
        .minmax { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

        /* Progress bar under a value */
        .bar-wrap { margin-top: 8px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; }
        .bar { height: 100%; border-radius: 999px; width: 0%; transition: width 0.4s ease; }
        .bar.good { background: linear-gradient(90deg, #2fd17a, #58e0a0); }
        .bar.warn { background: linear-gradient(90deg, #ffb020, #ffd35c); }
        .bar.bad  { background: linear-gradient(90deg, #ff5d6c, #ff8a97); }
        .bar.clock { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

        /* Compact per-core clock grid (built by buildCoreGrid). */
        .cores {
            border-top: 1px solid var(--border);
            padding: 14px 18px 16px;
        }

        .cores-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .cores-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
        }

        .cores-note {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .core-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
        }

        .core {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 9px 9px;
        }

        .core-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
        }

        .core-name {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--muted);
            white-space: nowrap;
        }

        /* Per-core temperature, shown beside the core when sensors and threads
           line up 1:1. */
        .core-temp {
            font-size: 10.5px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            color: var(--muted);
        }

        .core-temp.good { color: var(--good); }
        .core-temp.warn { color: var(--warn); }
        .core-temp.bad  { color: var(--bad); }

        .core-value {
            display: block;
            margin-top: 1px;
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .core-unit {
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            margin-left: 3px;
        }

        .core .bar-wrap { margin-top: 7px; height: 4px; }

        .core-range {
            margin-top: 6px;
            font-size: 10.5px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        footer.note {
            margin-top: 28px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 560px) {
            header.top { flex-direction: column; align-items: flex-start; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <div class="brand">
                <div class="logo">⚙️</div>
                <div>
                    <h1>OpenHWInfo</h1>
                    <div class="subtitle">Live CPU & GPU hardware monitor</div>
                </div>
            </div>
            <span class="refresh-note"><span class="dot"></span> Auto-refresh · 5s</span>
        </header>

        <main class="grid" id="cards"></main>

        <footer class="note">Data is collected locally on this host. Values refresh automatically every 5 seconds.</footer>
    </div>

    <script>
        // ---- Helpers -------------------------------------------------------
        function num(v) {
            if (v === null || v === undefined) return null;
            var n = parseFloat(String(v).replace(",", "."));
            return isNaN(n) ? null : n;
        }

        function frac(v, max) {
            if (!max || max <= 0) return null;
            var f = Math.max(0, Math.min(1, v / max));
            var cls = "good";
            if (f > 0.85) cls = "bad";
            else if (f > 0.6) cls = "warn";
            return { pct: Math.round(f * 100), cls: cls };
        }

        // Decide a 0..1 fraction + color class for a metric, using the card's
        // full value map so sibling metrics (e.g. vram.total) are available.
        function gauge(key, valStr, values) {
            var val = num(valStr);
            if (val === null) return null;

            if (/usage|percent/i.test(key)) return frac(val, 100);
            if (/temp/i.test(key)) return frac(val, 100);

            if (/power/i.test(key)) {
                var max = num(values["gpu.power.max"]) || val;
                if (max > 0 && key.indexOf("avg") !== -1) return frac(val, max);
                return null;
            }

            if (/vram\.used/i.test(key)) {
                var total = num(values["vram.total"]);
                if (total && total > 0) return frac(val, total);
            }

            return null;
        }

        // ---- Rendering -----------------------------------------------------
        function buildCard(iconSrc, title, subtitle, keys, values, minValues, maxValues) {
            var section = document.createElement("section");
            section.className = "card";

            var head = document.createElement("div");
            head.className = "card-head";
            var img = document.createElement("img");
            img.src = iconSrc;
            img.alt = title + " Icon";
            var headText = document.createElement("div");
            headText.innerHTML = '<div class="card-title"></div><div class="card-sub"></div>';
            headText.querySelector(".card-title").textContent = title;
            headText.querySelector(".card-sub").textContent = subtitle;
            head.appendChild(img);
            head.appendChild(headText);

            var table = document.createElement("table");
            var thead = document.createElement("thead");
            thead.innerHTML = "<tr><th>Metric</th><th>Current</th><th>Min</th><th>Max</th></tr>";
            var tbody = document.createElement("tbody");

            keys.forEach(function (k) {
                var key = k.Key;
                var tr = document.createElement("tr");
                tr.setAttribute("data-key", key);

                var tdLabel = document.createElement("td");
                tdLabel.className = "label-cell";
                tdLabel.textContent = k.Label;

                var tdValue = document.createElement("td");
                tdValue.className = "value-cell";
                tdValue.setAttribute("data-value", "");
                tdValue.textContent = values[key] !== undefined ? values[key] : "";

                var tdMin = document.createElement("td");
                tdMin.className = "minmax";
                tdMin.setAttribute("data-min", "");
                tdMin.textContent = minValues && minValues[key] !== undefined ? minValues[key] : "";

                var tdMax = document.createElement("td");
                tdMax.className = "minmax";
                tdMax.setAttribute("data-max", "");
                tdMax.textContent = maxValues && maxValues[key] !== undefined ? maxValues[key] : "";

                tr.appendChild(tdLabel);
                tr.appendChild(tdValue);
                tr.appendChild(tdMin);
                tr.appendChild(tdMax);
                tbody.appendChild(tr);

                // Progress bar for metrics with a meaningful scale.
                var g = gauge(key, values[key], values);
                if (g) {
                    var wrap = document.createElement("div");
                    wrap.className = "bar-wrap";
                    var bar = document.createElement("div");
                    bar.className = "bar " + g.cls;
                    bar.style.width = g.pct + "%";
                    wrap.appendChild(bar);
                    tdValue.appendChild(wrap);
                }
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            section.appendChild(head);
            section.appendChild(table);
            return section;
        }

        // ---- Per-core clocks & temperatures --------------------------------
        // Cores are rendered as compact grids rather than one table row each: a
        // 32-thread CPU would otherwise add 32 rows to the card.
        function isClockKey(key) {
            return /^cpu\.clock\d+$/.test(key);
        }

        function isCoreTempKey(key) {
            return /^cpu\.coreTemp\d+$/.test(key);
        }

        function trailingIndex(key) {
            var match = key.match(/(\d+)$/);
            return match ? parseInt(match[1], 10) : null;
        }

        // Severity class for a temperature, reusing the table's gauge thresholds.
        function tempSeverity(value) {
            var g = frac(value, 100);
            return g ? g.cls : "good";
        }

        // Header plus an empty grid container for one compact core block.
        function coreSection(titleText, noteText) {
            var section = document.createElement("div");
            section.className = "cores";

            var head = document.createElement("div");
            head.className = "cores-head";

            var title = document.createElement("span");
            title.className = "cores-title";
            title.textContent = titleText;

            var note = document.createElement("span");
            note.className = "cores-note";
            note.textContent = noteText;

            head.appendChild(title);
            head.appendChild(note);

            var grid = document.createElement("div");
            grid.className = "core-grid";

            section.appendChild(head);
            section.appendChild(grid);
            return { section: section, grid: grid };
        }

        // min – max line shared by every core cell.
        function coreRange(minValues, maxValues, key) {
            var lo = num(minValues && minValues[key]);
            var hi = num(maxValues && maxValues[key]);
            var range = document.createElement("div");
            range.className = "core-range";
            if (lo !== null || hi !== null) {
                range.textContent = (lo === null ? "—" : String(Math.round(lo))) +
                    " – " + (hi === null ? "—" : String(Math.round(hi)));
            }
            return range;
        }

        function buildCoreGrid(clockKeys, coreTempKeys, values, minValues, maxValues) {
            var out = document.createDocumentFragment();

            // Scale every bar against the highest clock any core has reached, so
            // the bars show boost headroom instead of pinning one core at 100%.
            var peak = 0;
            clockKeys.forEach(function (k) {
                var seen = num(maxValues && maxValues[k.Key]);
                var current = num(values[k.Key]);
                var candidate = seen !== null ? seen : (current !== null ? current : 0);
                if (candidate > peak) peak = candidate;
            });

            var tempByIndex = {};
            coreTempKeys.forEach(function (k) {
                var index = trailingIndex(k.Key);
                if (index !== null) tempByIndex[index] = k;
            });

            // The backend reports which physical core each thread runs on
            // (cpu.coreOfN, from /proc/cpuinfo). When that is available a thread
            // can be shown its own core's temperature even under SMT, where
            // there are more threads than core sensors.
            var tempByCore = {};
            coreTempKeys.forEach(function (k) {
                var index = trailingIndex(k.Key);
                if (index !== null) tempByCore[String(index)] = num(values[k.Key]);
            });
            var hasTopology = coreTempKeys.length > 0 && clockKeys.length > 0 &&
                clockKeys.every(function (k) {
                    var index = trailingIndex(k.Key);
                    return index !== null && values["cpu.coreOf" + index] !== undefined;
                });

            // Without topology the only safe pairing is one sensor per thread.
            // Index pairing under SMT would attribute a core's heat to whichever
            // thread happens to share its number, so the sensors get their own
            // block instead. Nothing is ever paired on a guess.
            var pairTemps = coreTempKeys.length > 0 &&
                (hasTopology || coreTempKeys.length === clockKeys.length);

            // Temperature for the physical core a given thread runs on.
            function tempForClock(key) {
                if (hasTopology) {
                    var index = trailingIndex(key);
                    if (index === null) return null;
                    return tempByCore[String(values["cpu.coreOf" + index]).trim()];
                }
                var tempKey = tempByIndex[trailingIndex(key)];
                if (!tempKey) return null;
                var paired = num(values[tempKey.Key]);
                return paired === undefined ? null : paired;
            }

            if (clockKeys.length > 0) {
                var threads = clockKeys.length + (clockKeys.length === 1 ? " thread" : " threads");
                var clocks = coreSection(
                    "Per-core clocks",
                    peak > 0 ? threads + " · peak " + Math.round(peak) + " MHz" : threads
                );

                clockKeys.forEach(function (k) {
                    var current = num(values[k.Key]);

                    var cell = document.createElement("div");
                    cell.className = "core";

                    var head = document.createElement("div");
                    head.className = "core-head";

                    var name = document.createElement("span");
                    name.className = "core-name";
                    name.textContent = "Core " + k.Key.replace(/^cpu\.clock/, "");
                    head.appendChild(name);

                    if (pairTemps) {
                        var temp = tempForClock(k.Key);
                        if (temp !== null && temp !== undefined) {
                            var tempEl = document.createElement("span");
                            tempEl.className = "core-temp " + tempSeverity(temp);
                            tempEl.textContent = Math.round(temp) + "°C";
                            head.appendChild(tempEl);
                        }
                    }

                    var value = document.createElement("div");
                    value.className = "core-value";
                    value.textContent = current === null ? "—" : String(Math.round(current));
                    if (current !== null) {
                        var unit = document.createElement("span");
                        unit.className = "core-unit";
                        unit.textContent = "MHz";
                        value.appendChild(unit);
                    }

                    var barWrap = document.createElement("div");
                    barWrap.className = "bar-wrap";
                    var bar = document.createElement("div");
                    bar.className = "bar clock";
                    bar.style.width = (peak > 0 && current !== null)
                        ? Math.round(Math.max(0, Math.min(1, current / peak)) * 100) + "%"
                        : "0%";
                    barWrap.appendChild(bar);

                    cell.appendChild(head);
                    cell.appendChild(value);
                    cell.appendChild(barWrap);
                    cell.appendChild(coreRange(minValues, maxValues, k.Key));
                    clocks.grid.appendChild(cell);
                });

                out.appendChild(clocks.section);
            }

            // Core sensors that were not folded into a clock cell get their own
            // block, so they stay visible and are never mislabeled.
            if (coreTempKeys.length > 0 && !pairTemps) {
                var sensors = coreTempKeys.length === 1 ? " sensor" : " sensors";
                var temps = coreSection("Per-core temperatures", coreTempKeys.length + sensors);

                coreTempKeys.forEach(function (k) {
                    var current = num(values[k.Key]);

                    var cell = document.createElement("div");
                    cell.className = "core";

                    var head = document.createElement("div");
                    head.className = "core-head";

                    var name = document.createElement("span");
                    name.className = "core-name";
                    name.textContent = "Core " + trailingIndex(k.Key);
                    head.appendChild(name);

                    var value = document.createElement("div");
                    value.className = "core-value";
                    value.textContent = current === null ? "—" : String(Math.round(current));
                    if (current !== null) {
                        var unit = document.createElement("span");
                        unit.className = "core-unit";
                        unit.textContent = "°C";
                        value.appendChild(unit);
                    }

                    var barWrap = document.createElement("div");
                    barWrap.className = "bar-wrap";
                    var bar = document.createElement("div");
                    bar.className = "bar " + tempSeverity(current === null ? 0 : current);
                    var g = current === null ? null : frac(current, 100);
                    bar.style.width = (g ? g.pct : 0) + "%";
                    barWrap.appendChild(bar);

                    cell.appendChild(head);
                    cell.appendChild(value);
                    cell.appendChild(barWrap);
                    cell.appendChild(coreRange(minValues, maxValues, k.Key));
                    temps.grid.appendChild(cell);
                });

                out.appendChild(temps.section);
            }

            return out;
        }

        function render(data) {
            var grid = document.getElementById("cards");
            grid.innerHTML = "";

            // CPU card: summary metrics as table rows, then the per-core clocks
            // and temperatures as compact grids below.
            var cpuBrand = data.CpuValues && data.CpuValues["cpu.brand"] ? data.CpuValues["cpu.brand"] : "CPU";
            var cpuKeys = data.CpuKeys || [];
            var cpuValues = data.CpuValues || {};
            var cpuMinValues = data.CpuMinValues || {};
            var cpuMaxValues = data.CpuMaxValues || {};

            var clockKeys = cpuKeys.filter(function (k) { return isClockKey(k.Key); });
            var coreTempKeys = cpuKeys.filter(function (k) { return isCoreTempKey(k.Key); });
            var metricKeys = cpuKeys.filter(function (k) {
                return !isClockKey(k.Key) && !isCoreTempKey(k.Key);
            });

            var cpuCard = buildCard(
                "/resources/cpu.png",
                "CPU",
                cpuBrand + " · " + cpuKeys.length + " metrics",
                metricKeys,
                cpuValues,
                cpuMinValues,
                cpuMaxValues
            );

            cpuCard.appendChild(buildCoreGrid(
                clockKeys, coreTempKeys, cpuValues, cpuMinValues, cpuMaxValues
            ));
            grid.appendChild(cpuCard);

            // GPU cards.
            (data.GpuViews || []).forEach(function (gpu) {
                grid.appendChild(buildCard(
                    "/resources/gpu.png",
                    gpu.Name,
                    "GPU · " + (gpu.Keys ? gpu.Keys.length : 0) + " metrics",
                    gpu.Keys || [],
                    gpu.Values || {},
                    gpu.MinValues || {},
                    gpu.MaxValues || {}
                ));
            });
        }

        // ---- Polling loop --------------------------------------------------
        // Wails v2 exposes bound methods under window.go.<package>.<StructName>.<Method>()
        function getData() {
            if (window.go && window.go.main && window.go.main.App) {
                return window.go.main.App.GetData();
            }
            // Fallback for older/alternate binding layouts.
            if (window.goApp && window.goApp.GetData) {
                return window.goApp.GetData();
            }
            throw new Error("Wails bindings not ready yet");
        }

        function tick() {
            try {
                getData().then(function (data) {
                    render(data);
                }).catch(function (err) {
                    console.error("GetData failed:", err);
                });
            } catch (e) {
                // Bindings may not be ready on the very first tick; retry shortly.
                console.warn(e.message || e);
                setTimeout(tick, 500);
            }
        }

        // Initial load + refresh every 5 seconds.
        tick();
        setInterval(tick, 5000);
    </script>
</body>
</html>
