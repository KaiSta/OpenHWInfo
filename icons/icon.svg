<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Badge background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Chip pins (legs on all four sides) -->
  <g fill="#ffffff">
    <!-- top -->
    <rect x="198" y="140" width="16" height="30" rx="4"/>
    <rect x="238" y="140" width="16" height="30" rx="4"/>
    <rect x="278" y="140" width="16" height="30" rx="4"/>
    <rect x="318" y="140" width="16" height="30" rx="4"/>
    <!-- bottom -->
    <rect x="198" y="342" width="16" height="30" rx="4"/>
    <rect x="238" y="342" width="16" height="30" rx="4"/>
    <rect x="278" y="342" width="16" height="30" rx="4"/>
    <rect x="318" y="342" width="16" height="30" rx="4"/>
    <!-- left -->
    <rect x="140" y="198" width="30" height="16" rx="4"/>
    <rect x="140" y="238" width="30" height="16" rx="4"/>
    <rect x="140" y="278" width="30" height="16" rx="4"/>
    <rect x="140" y="318" width="30" height="16" rx="4"/>
    <!-- right -->
    <rect x="342" y="198" width="30" height="16" rx="4"/>
    <rect x="342" y="238" width="30" height="16" rx="4"/>
    <rect x="342" y="278" width="30" height="16" rx="4"/>
    <rect x="342" y="318" width="30" height="16" rx="4"/>
  </g>

  <!-- Chip body -->
  <rect x="176" y="192" width="160" height="148" rx="30" fill="#ffffff"/>
  <!-- Recessed die -->
  <rect x="214" y="224" width="84" height="84" rx="16" fill="#1a2234"/>

  <!-- Live status dot (top-right corner of the chip) -->
  <circle cx="304" cy="216" r="15" fill="#2fd17a"/>
</svg>